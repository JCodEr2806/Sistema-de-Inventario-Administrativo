<div class="container mt-4">
  <h2 class="text-primary mb-4">
    <i
      class="bi"
      [ngClass]="modoEdicion ? 'bi-pencil-square' : 'bi-plus-circle'"
    ></i>
    {{ modoEdicion ? "Editar Producto" : "Agregar Producto" }}
  </h2>

  <form (ngSubmit)="guardarProducto()" #formProducto="ngForm">
    <div class="mb-3" *ngIf="modoEdicion">
      <label class="form-label">ID del Producto</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="nuevoProducto.id"
        name="id"
        readonly
      />
    </div>
    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Nombre del producto</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoProducto.nombre"
          name="nombre"
          required
        />
      </div>
      <div class="col-md-6 mb-3">
      <label class="form-label">Proveedor</label>
      <select
        class="form-select"
        [(ngModel)]="nuevoProducto.proveedorId"
        name="proveedorId"
        required
      >
        <option value="" disabled selected>Seleccione un Proveedor</option>
        <option *ngFor="let prov of proveedores" [value]="prov.id">
          {{ prov.nombre }}
        </option>
      </select>
    </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Categoría</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="nuevoProducto.categoria"
        name="categoria"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea
        class="form-control"
        [(ngModel)]="nuevoProducto.descripcion"
        name="descripcion"
      ></textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Precio (USD)</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="nuevoProducto.precio"
          name="precio"
          required
        />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Stock</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="nuevoProducto.cantidad"
          name="cantidad"
          required
        />
      </div>
    </div>

    <div class="d-flex justify-content-between">
      <button
        type="button"
        class="btn btn-secondary"
        [routerLink]="['/inventario']"
      >
        <i class="bi bi-arrow-left-circle"></i> Volver
      </button>

      <button
        type="submit"
        class="btn btn-success"
        [disabled]="formProducto.invalid"
      >
        <i
          class="bi"
          [ngClass]="modoEdicion ? 'bi-pencil-square' : 'bi-save'"
        ></i>
        {{ modoEdicion ? "Actualizar Producto" : "Guardar Producto" }}
      </button>
    </div>
  </form>
</div>
