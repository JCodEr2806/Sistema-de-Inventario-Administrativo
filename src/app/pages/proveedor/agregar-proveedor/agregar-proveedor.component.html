<div class="container mt-4">
  <h2 class="text-primary mb-4">
    <i
      class="bi"
      [ngClass]="modoEdicion ? 'bi-pencil-square' : 'bi-plus-circle'"
    ></i>
    {{ modoEdicion ? "Editar Proveedor" : "Agregar Proveedor" }}
  </h2>

  <form (ngSubmit)="guardarProveedor()" #formProveedor="ngForm">
    <div class="mb-3" *ngIf="modoEdicion">
      <label class="form-label">ID del Proveedor</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="nuevoProveedor.id"
        name="id"
        readonly
      />
    </div>
    <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label">Nombre del proveedor</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="nuevoProveedor.nombre"
            name="nombre"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">RUC</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="nuevoProveedor.ruc"
            name="ruc"
            required
          />
        </div>
    </div>

    <div class="row">

        <div class="col-md-4 mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="nuevoProveedor.email"
            name="email"
            required
          />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Teléfono</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="nuevoProveedor.telefono"
            name="telefono"
            required
          />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Dirección</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="nuevoProveedor.direccion"
            name="direccion"
            required
          />
        </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Codigo Postal</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="nuevoProveedor.codigo_postal"
          name="codigo_postal"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Ciudad</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoProveedor.ciudad"
          name="ciudad"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Pais</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoProveedor.pais"
          name="pais"
          required
        />
      </div>

    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea
        class="form-control"
        [(ngModel)]="nuevoProveedor.descripcion"
        name="descripcion"
      ></textarea>
    </div>

    <div class="d-flex justify-content-between">
      <button
        type="button"
        class="btn btn-secondary"
        [routerLink]="['/proveedores']"
      >
        <i class="bi bi-arrow-left-circle"></i> Volver
      </button>

      <button
        type="submit"
        class="btn btn-success"
        [disabled]="formProveedor.invalid"
      >
        <i
          class="bi"
          [ngClass]="modoEdicion ? 'bi-pencil-square' : 'bi-save'"
        ></i>
        {{ modoEdicion ? "Actualizar Proveedor" : "Guardar Proveedor" }}
      </button>
    </div>
  </form>
</div>
