<div class="d-flex" style="height: 100vh;">
    <!-- 1. SIDEBAR (Menú Lateral) - Fijo en el lado izquierdo -->
    <div class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white shadow-lg" 
         style="width: 250px;">
        
        <!-- Nombre de la Empresa -->
        <a routerLink="/inventario" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none border-bottom pb-3">
            <i class="bi bi-shop fs-4 me-2"></i>
            <span class="fs-5 fw-bold">{{ nombreEmpresa }}</span>
        </a>
        
        <!-- Lista de Navegacion -->
        <ul class="nav nav-pills flex-column mb-auto mt-3">
            <li class="nav-item mb-1" *ngFor="let item of menuItems">
                
                <!-- Con el routerLinkActive se agrega la clase "active" al enlace activo -->
                <a [routerLink]="item.route" 
                   routerLinkActive="active"
                   class="nav-link text-white py-2" 
                   aria-current="page">
                    <i [ngClass]="['bi', item.icon, 'me-2']"></i>
                    {{ item.name }}
                </a>
            </li>
        </ul>
        
        <hr>
        
        <button class="btn btn-outline-danger" (click)="cerrarSesion()">
             <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
        </button>

    </div>
    <!-- FIN SIDEBAR -->

    <div class="flex-grow-1 d-flex flex-column">
        
        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
            <div class="container-fluid">
                <div class="d-flex flex-grow-1"></div> 

                <div class="d-flex align-items-center">
                    <span class="me-3 text-secondary">
                        <i class="bi bi-person-circle me-1"></i> Bienvenido, **{{ nombreUsuario }}**
                    </span>
                </div>
            </div>
        </nav>
        <!-- FIN NAVBAR -->

        <!-- Aca van el Dashboard, Productos, etc -->
        <main class="p-4 flex-grow-1 bg-light overflow-auto">
            <router-outlet></router-outlet>
        </main>
        
    </div>
</div>
