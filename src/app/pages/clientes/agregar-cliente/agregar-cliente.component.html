<div class="container mt-4">
  <h2 class="text-primary mb-4">
    <i
      class="bi"
      [ngClass]="modoEdicion ? 'bi-pencil-square' : 'bi-plus-circle'"
    ></i>
    {{ modoEdicion ? "Editar Cliente" : "Agregar Cliente" }}
  </h2>

  <form (ngSubmit)="guardarCliente()" #formCliente="ngForm">
    <div class="mb-3" *ngIf="modoEdicion">
      <label class="form-label">ID del Cliente</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="nuevoCliente.id"
        name="id"
        readonly
      />
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Nombre del cliente</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoCliente.nombre"
          name="nombre"
          required
        />
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Apellido</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoCliente.apellido"
          name="apellido"
          required
        />
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="nuevoCliente.email"
          name="email"
          required
        />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Teléfono</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoCliente.telefono"
          name="telefono"
          required
        />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Dirección</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoCliente.direccion"
          name="direccion"
          required
        />
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Ciudad</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nuevoCliente.ciudad"
          name="ciudad"
          required
        />
      </div>
    </div>

    <div class="d-flex justify-content-between">
      <button
        type="button"
        class="btn btn-secondary"
        [routerLink]="['/clientes']"
      >
        <i class="bi bi-arrow-left-circle"></i> Volver
      </button>

      <button
        type="submit"
        class="btn btn-success"
        [disabled]="formCliente.invalid"
      >
        <i
          class="bi"
          [ngClass]="modoEdicion ? 'bi-pencil-square' : 'bi-save'"
        ></i>
        {{ modoEdicion ? "Actualizar Proveedor" : "Guardar Proveedor" }}
      </button>
    </div>
  </form>
</div>
